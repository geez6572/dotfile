# Hyprland Configuration
# Migrated from i3

# Monitor setup
monitor=eDP-1,preferred,auto,1
monitor=DP-1,1920x1080@60,0x0,1

# Input settings
input {
    kb_layout=us
    kb_options=
    follow_mouse=1
    touchpad {
        natural_scroll=0
    }
}

# General settings
general {
    gaps_in=7
    gaps_out=0
    border_size=1
    col.active_border=rgba(0088CCee)
    col.inactive_border=rgba(333333ee)
    layout=dwindle
    allow_tearing=0
}

# Decoration
decoration {
    rounding=0
    blur {
        enabled=1
        size=3
        passes=2
    }
}

# Animations
animations {
    enabled=1
    bezier=linear,0,0,1,1
    animation=windows,1,7,default,slide
    animation=workspaces,1,6,default
}

# Dwindle layout
dwindle {
    pseudotile=0
    preserve_split=0
}

# Master layout
master {
    new_status=slave
}



# Mod key (same as i3 - Super/Win)
$mod=SUPER

# Terminal (ghostty)
$terminal=ghostty

# Program launcher (wofi - Wayland compatible rofi replacement)
$menu=/home/ce/.config/rofi/launchers/type-3/launcher.sh

# Key bindings - Window management
bind=$mod,Return,exec,$terminal
bind=$mod,q,killactive,
bind=$mod,semicolon,exec,$menu
bind=$mod,f,fullscreen,
bind=$mod,Shift+space,togglefloating,
bind=$mod,space,togglesplit,

# Move focus with vi keys
bind=$mod,h,movefocus,l
bind=$mod,j,movefocus,d
bind=$mod,k,movefocus,u
bind=$mod,l,movefocus,r

# Move focus with arrow keys
bind=$mod,Left,movefocus,l
bind=$mod,Down,movefocus,d
bind=$mod,Up,movefocus,u
bind=$mod,Right,movefocus,r

# Swap windows
bind=$mod,Shift+h,swapwindow,l
bind=$mod,Shift+j,swapwindow,d
bind=$mod,Shift+k,swapwindow,u
bind=$mod,Shift+l,swapwindow,r

bind=$mod,Shift+Left,swapwindow,l
bind=$mod,Shift+Down,swapwindow,d
bind=$mod,Shift+Up,swapwindow,u
bind=$mod,Shift+Right,swapwindow,r

# Move/resize windows with mouse
bindm=$mod,mouse:272,movewindow
bindm=$mod,mouse:273,resizewindow

# Change splits
bind=$mod,c,splitratio,-0.2
bind=$mod,v,splitratio,0.2

# Layout toggles
bind=$mod,s,layoutmsg,cyclelayouts,*
bind=$mod,w,layoutmsg,cyclelayouts,*


# Workspaces
bind=$mod,1,workspace,1
bind=$mod,2,workspace,2
bind=$mod,3,workspace,3
bind=$mod,4,workspace,4
bind=$mod,5,workspace,5
bind=$mod,6,workspace,6
bind=$mod,7,workspace,7
bind=$mod,8,workspace,8
bind=$mod,9,workspace,9
bind=$mod,0,workspace,10

# Move window to workspace
bind=$mod+Shift,1,movetoworkspace,1
bind=$mod+Shift,2,movetoworkspace,2
bind=$mod+Shift,3,movetoworkspace,3
bind=$mod+Shift,4,movetoworkspace,4
bind=$mod+Shift,5,movetoworkspace,5
bind=$mod+Shift,6,movetoworkspace,6
bind=$mod+Shift,7,movetoworkspace,7
bind=$mod+Shift,8,movetoworkspace,8
bind=$mod+Shift,9,movetoworkspace,9
bind=$mod+Shift,0,movetoworkspace,10
bind=$mod+CTRL,Delete,exec,wlogout
bind=$mod,M,exec,~/.config/hypr/scripts/wallpaper-select.sh

# Reload/exit
#bind=$mod+Shift+r,exec,hyprctl reload
#bind=$mod+Shift+Delete,exec,wlogout

# Resize mode
binde=$mod,r,submap,resize

submap=resize
binde=,h,resizeactive,-10 0
binde=,j,resizeactive,0 10
binde=,k,resizeactive,0 -10
binde=,l,resizeactive,10 0
binde=,Left,resizeactive,-10 0
binde=,Down,resizeactive,0 10
binde=,Up,resizeactive,0 -10
binde=,Right,resizeactive,10 0
binde=,escape,submap,reset
binde=,return,submap,reset
binde=$mod,r,submap,reset
submap=reset

# Media keys (using wpctl for PipeWire)
binde=,XF86AudioRaiseVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde=,XF86AudioLowerVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=,XF86AudioMute,exec,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=,XF86AudioMicMute,exec,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Startup applications
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once=fcitx5 -d
exec=~/.config/hypr/scripts/monitor-auto.sh

# Wallpapers (using hyprpaper)
exec-once=swww-daemon
exec-once=sleep 1 && swww img $(cat ~/.cache/current_wallpaper)

# Status bar (waybar)
exec-once=waybar

# Lock screen (hyprlock)
exec-once=hyprlock &


# 启动剪贴板监听，保存图片和文本
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
