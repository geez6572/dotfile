background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.2
    brightness = 0.8
    vibrancy = 0.2
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size = 90
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    font_size = 24
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 55
    position = 0, -100
    halign = center
    valign = center

    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(ffffffaa)
    inner_color = rgba(00000066)
    font_color = rgb(ffffff)

    fade_on_empty = false
    rounding = 12
}
