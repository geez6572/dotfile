palette = 'theme'

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[character]
success_symbol = "[>](bold fg:ok)"
error_symbol = "[>](bold fg:err)"
vimcmd_symbol = "[<](bold fg:ok)"

[directory]
style = "fg:bg2"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[$branch]($style) "
style = "fg:fg3"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](fg:accent) ($ahead_behind$stashed)]($style) "
style = "fg:bg2"
conflicted = ""
untracked = ""
modified = ""
staged = ""
renamed = ""
deleted = ""
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "fg:fg3"

[cmd_duration]
format = "[$duration]($style) "
style = "fg:accent"

[python]
format = "[$virtualenv]($style) "
style = "fg:fg3"
detect_extensions = []
detect_files = []

[line_break]
disabled = false
