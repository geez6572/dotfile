palette = 'theme'

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$nodejs\
$bun\
$rust\
$golang\
$python\
$docker_context\
$time\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold fg:ok)"
error_symbol = "[❯](bold fg:err)"
vimcmd_symbol = "[❮](bold fg:ok)"

[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
style = "fg:bg2"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = '\[[$symbol$branch]($style)\] '
style = "fg:accent"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style)) '
style = "fg:bg2"

[nodejs]
format = '\[[$symbol($version)]($style)\] '
style = "fg:bg2"

[bun]
format = '\[[$symbol($version)]($style)\] '
style = "fg:bg2"

[rust]
format = '\[[$symbol($version)]($style)\] '
style = "fg:bg2"

[golang]
format = '\[[$symbol($version)]($style)\] '
style = "fg:bg2"

[python]
format = '\[[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style)\] '
style = "fg:accent"

[docker_context]
format = '\[[$symbol$context]($style)\] '
style = "fg:bg2"

[cmd_duration]
format = '\[[⏱ $duration]($style)\] '
style = "fg:accent"

[time]
disabled = false
format = '\[[$time]($style)\] '
time_format = "%R"
style = "fg:fg3"

[line_break]
disabled = false
