palette = 'theme'

format = """
[░▒▓](bg1)\
[  ](bg:bg1 fg:bg2)\
[](bg:bg2 fg:bg1)\
$directory\
[](fg:bg2 fg:bg3)\
$git_branch\
$git_status\
[](fg:bg3 fg:bg4)\
$cmd_duration\
$nodejs\
$bun\
$rust\
$golang\
$python\
$php\
$docker_context\
[](fg:bg4 fg:bg5)\
$time\
[](fg:bg5)\
$line_break\
$character"""

[character]
success_symbol = '[❯](bold fg:ok)'
error_symbol = '[❯](bold fg:err)'
vimcmd_symbol = '[❮](bold fg:ok)'

[directory]
style = "fg:fg1 bg:bg2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:bg3"
format = '[[ $symbol $branch ](fg:fg2 bg:bg3)]($style)'

[git_status]
style = "bg:bg3"
format = '[[($all_status$ahead_behind )](fg:fg2 bg:bg3)]($style)'

[nodejs]
symbol = ""
style = "bg:bg4"
format = '[[ $symbol ($version) ](fg:fg2 bg:bg4)]($style)'

[bun]
symbol = ""
style = "bg:bg4"
format = '[[ $symbol ($version) ](fg:fg2 bg:bg4)]($style)'

[rust]
symbol = ""
style = "bg:bg4"
format = '[[ $symbol ($version) ](fg:fg2 bg:bg4)]($style)'

[golang]
symbol = ""
style = "bg:bg4"
format = '[[ $symbol ($version) ](fg:fg2 bg:bg4)]($style)'

[python]
symbol = ""
style = "bg:bg4"
format = '[[ $symbol ($version) ](fg:fg2 bg:bg4)]($style)'

[php]
symbol = ""
style = "bg:bg4"
format = '[[ $symbol ($version) ](fg:fg2 bg:bg4)]($style)'

[cmd_duration]
min_time = 2_000
style = "bg:bg4"
format = '[[  $duration ](fg:accent bg:bg4)]($style)'
show_milliseconds = false

[docker_context]
symbol = ""
style = "bg:bg4"
format = '[[ $symbol $context ](fg:fg2 bg:bg4)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:bg5"
format = '[[  $time ](fg:fg3 bg:bg5)]($style)'

[line_break]
disabled = false
